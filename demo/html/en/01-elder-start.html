<!doctype html>
<html lang="en" dir="ltr"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F6F2EA">
  <title>Hallo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&amp;family=Fraunces:opsz,wght@9..144,700&amp;display=swap">
  <style data-from="/static/elder.css">:root { --paper: #F6F2EA; --paper-lift: #FDFBF7; --ink: #241E19; --ink-2: #5C5149; --ink-3: #786D63; --rule: #E3D9C9; --amber: #E0900F; --amber-deep: #A96A06; --amber-wash: #FBEFD8; --alarm: #B3341B; --alarm-wash: #FBE7E2; --watch: #9A6510; --watch-wash: #FAEBD6; --calm: #2F6A46; --calm-wash: #E3F0E7; --face-display: "Fraunces", Georgia, "Songti SC", serif; --face-ui: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui,
             "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; --t-elder-body: 23px; --t-elder-say: 25px; --t-elder-lead: 21px; --t-body: 17px; --t-lead: 20px; --t-meta: 15px; --r-chip: 999px; --r-card: 20px; --r-panel: 28px; --r-control: 18px; --lift-1: 0 0 10px rgba(36, 30, 25, 0.10); --lift-2: 0 0 18px rgba(36, 30, 25, 0.14); --gutter: 22px; --tap: 48px; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0px; height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--face-ui); font-size: var(--t-elder-body); line-height: 1.5; text-size-adjust: 100%; overflow: hidden; height: 100%; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.elder-app { height: 100dvh; display: flex; flex-direction: column; padding: max(18px, env(safe-area-inset-top)) var(--gutter)
           max(14px, env(safe-area-inset-bottom)); max-width: 560px; margin-inline: auto; }
.elder-header { display: flex; align-items: center; gap: 13px; flex: 0 0 auto; }
.avatar { width: 42px; height: 42px; flex: 0 0 auto; }
.avatar .disc { fill: var(--amber); }
.avatar .ray { stroke: var(--amber); }
.elder-header h1 { font-family: var(--face-display); font-weight: 700; font-size: 28px; margin: 0px; letter-spacing: -0.015em; line-height: 1.15; }
.subtitle { margin: 1px 0px 0px; color: var(--ink-2); font-size: 17px; }
.lang-switch { margin-left: auto; flex: 0 0 auto; min-height: var(--tap); min-width: var(--tap); padding: 0px 16px; border: 2px solid var(--rule); border-radius: var(--r-chip); background: var(--paper-lift); color: var(--ink-2); font-family: var(--face-ui); font-size: 17px; font-weight: 700; cursor: pointer; }
.lang-switch:active { background: var(--amber-wash); }
.start { flex: 1 1 0%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; }
.start-greeting { font-family: var(--face-display); font-weight: 700; font-size: 38px; margin: 0px; text-align: center; letter-spacing: -0.02em; line-height: 1.2; }
.start-btn { min-height: 74px; padding: 0px 44px; border: 0px; border-radius: var(--r-control); background: var(--amber); color: var(--ink); font-family: var(--face-ui); font-size: 26px; font-weight: 700; cursor: pointer; box-shadow: 0 5px 0 var(--amber-deep); }
.start-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--amber-deep); }
.chat { flex: 1 1 0%; display: flex; flex-direction: column; min-height: 0px; }
.status, .mic, .mic-hint, .type-instead, .disclaimer { flex: 0 0 auto; }
.conversation { flex: 1 1 0%; min-height: 0px; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; justify-content: flex-end; gap: 12px; padding: 22px 0px 16px; }
.bubble { max-width: 88%; padding: 15px 19px; font-size: var(--t-elder-say); line-height: 1.45; animation: 220ms ease-out 0s 1 normal none running bubble-in; }
.bubble.assistant { align-self: flex-start; background: var(--paper-lift); border: 1px solid var(--rule); border-radius: var(--r-card) var(--r-card) var(--r-card) 7px; box-shadow: var(--lift-1); }
.bubble.user { align-self: flex-end; background: var(--ink); color: var(--paper-lift); border-radius: var(--r-card) var(--r-card) 7px var(--r-card); }
@keyframes bubble-in { 
  0% { opacity: 0; transform: translateY(8px); }
  100% { opacity: 1; transform: none; }
}
.status { flex: 0 0 auto; margin: 0px 0px 12px; min-height: 30px; text-align: center; font-size: var(--t-elder-lead); font-weight: 700; color: var(--ink-2); }
[data-state="listening"] .status { color: var(--alarm); }
[data-state="thinking"] .status { color: var(--ink-2); }
[data-state="speaking"] .status { color: var(--calm); }
.mic { flex: 0 0 auto; width: 100%; min-height: 84px; display: flex; align-items: center; justify-content: center; gap: 13px; border: 0px; border-radius: var(--r-control); background: var(--amber); color: var(--ink); font-family: var(--face-ui); font-size: 26px; font-weight: 700; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; box-shadow: 0 5px 0 var(--amber-deep); }
.mic svg { width: 31px; height: 31px; flex: 0 0 auto; fill: currentcolor; }
.mic:active, [data-state="listening"] .mic { transform: translateY(3px); box-shadow: 0 2px 0 var(--amber-deep); }
[data-state="listening"] .mic { background: var(--alarm); color: rgb(255, 255, 255); box-shadow: rgb(126, 36, 19) 0px 2px 0px; }
[data-state="thinking"] .mic, [data-state="speaking"] .mic { background: var(--rule); color: var(--ink-2); box-shadow: rgb(207, 195, 174) 0px 5px 0px; }
.mic:focus-visible { outline: 4px solid var(--ink); outline-offset: 3px; }
.mic-hint { flex: 0 0 auto; margin: 11px 0px 0px; text-align: center; color: var(--ink-3); font-size: 17px; }
.type-instead { flex: 0 0 auto; margin-top: 12px; }
.type-instead > summary { list-style: none; cursor: pointer; text-align: center; min-height: var(--tap); display: flex; align-items: center; justify-content: center; color: var(--ink-2); font-size: 18px; text-decoration: underline; text-underline-offset: 4px; }
.type-instead > summary::-webkit-details-marker { display: none; }
.text-form { display: flex; gap: 9px; padding-top: 9px; }
#text-input { flex: 1 1 0%; min-height: var(--tap); padding: 0px 16px; border: 2px solid var(--rule); border-radius: var(--r-control); background: var(--paper-lift); color: var(--ink); font-family: var(--face-ui); font-size: 20px; }
#text-input:focus-visible { outline: 3px solid var(--ink); outline-offset: 1px; border-color: var(--ink); }
.text-form button { min-height: var(--tap); padding: 0px 22px; border: 0px; border-radius: var(--r-control); background: var(--ink); color: var(--paper-lift); font-family: var(--face-ui); font-size: 19px; font-weight: 700; cursor: pointer; }
.disclaimer { flex: 0 0 auto; padding: 13px 4px 0px; text-align: center; color: var(--ink-3); font-size: 15px; line-height: 1.45; }
@media (max-height: 700px) {
  .conversation { padding-top: 14px; }
  .elder-header h1 { font-size: 24px; }
  .start-greeting { font-size: 31px; }
}
@media (prefers-reduced-motion: reduce) {
  .bubble { animation: auto ease 0s 1 normal none running none; }
  .mic, .start-btn { transition: none; }
}
.voice-switch { margin-left: auto; display: inline-flex; gap: 6px; flex: 0 0 auto; }
.voice-switch button { min-height: var(--tap); padding: 0px 14px; border: 2px solid var(--rule); border-radius: var(--r-chip); background: var(--paper-lift); color: var(--ink-2); font-family: var(--face-ui); font-size: 16px; font-weight: 700; cursor: pointer; }
.voice-switch button[aria-pressed="true"] { background: var(--amber-wash); border-color: var(--amber); color: var(--ink); }
.elder-header .lang-switch { margin-left: 0px; }
@media (max-width: 430px) {
  .elder-header { flex-wrap: wrap; }
  .voice-switch { margin-left: 0px; }
  .voice-switch button, .elder-header .lang-switch { font-size: 15px; padding: 0px 12px; }
}
</style>
  
  <meta name="apple-mobile-web-app-title" content="Hallo">
  <!-- iOS ignores the manifest: these three meta tags are what make "Add to Home Screen"
       open full screen, and it only ever uses apple-touch-icon.png. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <link rel="icon" href="/static/icons/icon-192.png" type="image/png">
</head>
<body class="elder" data-state="idle">
  <main class="elder-app">
    <header class="elder-header">
      <svg class="avatar" viewBox="0 0 48 48" aria-hidden="true">
        <circle class="disc" cx="24" cy="24" r="10.5"></circle>
        <g class="ray" stroke-width="3.5" stroke-linecap="round">
          <line x1="24" y1="4" x2="24" y2="9"></line><line x1="24" y1="39" x2="24" y2="44"></line>
          <line x1="4" y1="24" x2="9" y2="24"></line><line x1="39" y1="24" x2="44" y2="24"></line>
          <line x1="9.9" y1="9.9" x2="13.4" y2="13.4"></line><line x1="34.6" y1="34.6" x2="38.1" y2="38.1"></line>
          <line x1="9.9" y1="38.1" x2="13.4" y2="34.6"></line><line x1="34.6" y1="13.4" x2="38.1" y2="9.9"></line>
        </g>
      </svg>
      <div>
        <h1>Hallo</h1>
        <p class="subtitle">Here for you, Maggie</p>
      </div>
      <div id="voice-switch" class="voice-switch" role="group" aria-label="Hallo's voice">
        <button type="button" data-voice="female" aria-pressed="true">Woman's voice</button>
        <button type="button" data-voice="male" aria-pressed="false">Man's voice</button>
      </div>
      <button id="lang-btn" class="lang-switch" type="button" data-next="zh">中文</button>
    </header>

    <section id="start-screen" class="start">
      <p class="start-greeting">Hello, Maggie!</p>
      <button id="start-btn" class="start-btn" type="button">Start chatting</button>
    </section>

    <section id="chat-screen" class="chat" hidden="">
      <div id="conversation" class="conversation" aria-live="polite"></div>

      <p id="status" class="status" role="status"></p>

      <button id="mic-btn" class="mic" type="button" aria-label="Hold to talk" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="9" y="2.5" width="6" height="12" rx="3"></rect>
          <path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
        </svg>
        <span id="mic-label">Hold and speak</span>
      </button>
      <p class="mic-hint">Release to send</p>

      <details class="type-instead">
        <summary>Type instead</summary>
        <form id="text-form" class="text-form" autocomplete="off">
          <label for="text-input" class="visually-hidden">Your message</label>
          <input id="text-input" type="text" maxlength="2000" placeholder="Type a message…">
          <button type="submit">Send</button>
        </form>
      </details>
    </section>

    <footer class="disclaimer">Hallo is an AI companion, not a medical service. In an emergency, call 911.</footer>
  </main>

  
  
  
  

</body></html>
